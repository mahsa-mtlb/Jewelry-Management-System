{% extends "base.html" %}

{% block title %}
ثبت قیمت روز
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-dark text-white">
        <h4 class="mb-0">
            ثبت قیمت روز طلا
        </h4>
    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                ذخیره
            </button>

            <a href="{% url 'pricing:list' %}"
               class="btn btn-secondary">
                انصراف
            </a>

        </form>

    </div>

</div>

{% endblock %}
