{% load static %}
{% load humanize %}
{% load product_tags %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}Jewelry Management{% endblock %}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap"
            rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.rtl.min.css"
            rel="stylesheet">

        <link rel="stylesheet" href="{% static 'css/style.css' %}">

    </head>

<body class="jm-body">

    {% include 'includes/navbar.html' %}

    <div class="container-fluid">
        <div class="row">

            {% include 'includes/sidebar.html' %}

            <main class="col-md-10 px-4 py-4">

                {% include 'includes/messages.html' %}

                {% block content %}
                {% endblock %}

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
